spring.application.name=Mini-ERP

spring.datasource.url=jdbc:h2:mem:minierp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=ReplaceThisWithALongRandomSecretKeyOfAtLeast32Chars
app.jwt.expiration-ms=86400000

app.system-admin.login-id=sysadmin
app.system-admin.email=sysadmin@shivfurniture.com
app.system-admin.password=Admin@123
app.system-admin.full-name=System Administrator

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

app.upload.dir=uploads/products