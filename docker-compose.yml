services:
  mysql:
    image: mysql:8.4
    container_name: mini-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minierp}
      MYSQL_USER: ${MYSQL_USER:-minierp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minierp123}
    ports:
      - "3307:3306"
    volumes:
      - mini_erp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Backend/Mini-ERP
      dockerfile: Dockerfile
    container_name: mini-erp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/minierp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-minierp}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-minierp123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ReplaceThisWithALongRandomSecretKeyOfAtLeast32Chars}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: mini-erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mini_erp_mysql_data: